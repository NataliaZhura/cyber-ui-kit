<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ЖДуша</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--bg2:var(--tg-theme-secondary-bg-color,#f2f3f5);
--text:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#8a8f98);
--link:var(--tg-theme-link-color,#2481cc);--btn:var(--tg-theme-button-color,#2481cc);
--btn-text:var(--tg-theme-button-text-color,#fff);--sep:color-mix(in srgb,var(--hint) 25%,transparent)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg2);color:var(--text);font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--sep)}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:none;color:var(--hint);font:inherit;font-size:14px;font-weight:600;padding:12px 6px;
border-bottom:2px solid transparent;cursor:pointer}
.tab.on{color:var(--link);border-color:var(--link)}
.search{padding:8px 16px 10px}
.search input{width:100%;border:0;border-radius:10px;padding:9px 12px;background:var(--bg2);color:var(--text);font:inherit}
main{padding:12px 16px 40px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--bg);border-radius:14px;padding:12px;border:0;text-align:left;color:var(--text);font:inherit;cursor:pointer;min-height:76px}
.card b{display:block;font-size:15px}
.card small{color:var(--hint);display:block;margin-top:4px}
.count{float:right;background:var(--bg2);border-radius:10px;padding:0 8px;font-size:13px;color:var(--hint)}
.count.new{background:var(--btn);color:var(--btn-text)}
h2{font-size:17px;margin:4px 0 12px;display:flex;align-items:center;gap:8px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);margin:22px 4px 8px}
.back{border:0;background:none;color:var(--link);font:inherit;font-size:22px;padding:0 4px;cursor:pointer}
.list{background:var(--bg);border-radius:14px;overflow:hidden}
.row{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--sep)}
.row:last-child{border-bottom:0}
.ico{flex:0 0 36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:#8a8f98}
.ico.pdf{background:#d93025}.ico.docx{background:#2b6cd8}.ico.xlsx,.ico.xls,.ico.csv{background:#1e8e3e}.ico.png,.ico.jpg,.ico.jpeg{background:#8e44ad}
.meta{flex:1;min-width:0}
.meta div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{color:var(--hint)}
.act{border:0;background:var(--bg2);color:var(--link);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px;cursor:pointer}
.main-btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;margin:0 0 12px;background:var(--btn);color:var(--btn-text);font:inherit;font-weight:600;cursor:pointer}
.ghost{background:var(--bg);color:var(--link)}
.tag{display:inline-block;border-radius:6px;padding:0 5px;font-size:11px;font-weight:600;vertical-align:1px}
.tag.new{background:var(--btn);color:var(--btn-text)}.tag.guest{background:#f2994a;color:#fff}
.ask{display:flex;gap:8px;margin:0 0 12px}.ask input{flex:1;min-width:0;border:1px solid var(--sep);border-radius:10px;
padding:9px 10px;background:var(--bg);color:var(--text);font:inherit}.ask .main-btn{width:auto;margin:0;padding:10px 14px}
.empty{color:var(--hint);text-align:center;padding:24px 12px;background:var(--bg);border-radius:14px}
.box{background:var(--bg);border-radius:14px;padding:12px;margin-bottom:10px}
.box label{display:block;font-weight:600;margin-bottom:6px}
.box small{color:var(--hint);display:block;margin-bottom:8px}
.box input,.box textarea{width:100%;border:1px solid var(--sep);border-radius:10px;padding:9px 10px;background:var(--bg2);color:var(--text);font:inherit}
.box textarea{min-height:84px;resize:vertical}
.box .main-btn{margin:8px 0 0}
#toast{position:fixed;left:16px;right:16px;bottom:16px;background:#222;color:#fff;border-radius:12px;padding:12px 14px;
opacity:0;transform:translateY(20px);transition:.2s;pointer-events:none;z-index:5}
#toast.on{opacity:1;transform:none}
.err{padding:40px 20px;text-align:center;color:var(--hint)}
.card.build{grid-column:1/-1;background:var(--btn);color:var(--btn-text)}.card.build small{color:var(--btn-text);opacity:.85}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.seg button{flex:1 1 30%;border:1px solid var(--sep);background:var(--bg2);color:var(--text);
border-radius:10px;padding:8px 4px;font:inherit;font-size:13px;cursor:pointer}.seg button.on{background:var(--btn);color:var(--btn-text);border-color:var(--btn)}
.why{margin:6px 0 0;padding-left:18px}.why li{margin:3px 0;font-size:13px}
.fh{margin:10px 0;padding-bottom:8px;border-bottom:1px solid var(--sep)}.fh:last-of-type{border-bottom:0}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f2 div small{margin:0 0 3px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0}.tbl th,.tbl td{padding:5px 4px;border-bottom:1px solid var(--sep);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal}.tbl th{color:var(--hint);font-weight:600}
.tbl tr.me td{font-weight:700}.wrap{overflow-x:auto}.note{color:var(--hint);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header>
  <nav class="tabs" id="tabs"></nav>
  <div class="search"><input id="q" type="search" placeholder="Поиск по всем отчётам" autocomplete="off"></div>
</header>
<main id="view"><div class="err">Загружаю…</div></main>
<div id="toast"></div>
<input id="file" type="file" multiple hidden accept=".pdf,.docx,.xlsx,.xls,.pptx,.csv,.png,.jpg,.jpeg,.md,.html,.htm">
<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const TABS = ["Рынок", "Прогнозы", "Компании", "Задача"];
const TASKS = [
  {cmd: "/find", title: "Найти ИНН и ОГРН", hint: "Название компании", ph: "например, Первая грузовая компания"},
  {cmd: "/remember", title: "Запомнить", hint: "Компания, правило или факт", ph: "например, ПГК — в приоритете"},
  {cmd: "/save", title: "Сохранить в PDF и Word", hint: "Что сохранить", ph: "например, последнюю справку по ПГК"},
];
const S = {data: null, tab: "Рынок", section: null, seen: {}};
try { S.seen = JSON.parse(localStorage.getItem("zseen") || "{}"); } catch (e) {}
try { const t = localStorage.getItem("ztab"); if (TABS.includes(t)) S.tab = t; } catch (e) {}
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

async function api(path, body, raw) {
  const opt = {headers: {"X-Init-Data": tg?.initData || ""}};
  if (body !== undefined) {
    opt.method = "POST";
    if (raw) { opt.body = body; opt.headers["X-File-Name"] = encodeURIComponent(raw); }
    else { opt.body = JSON.stringify(body); opt.headers["Content-Type"] = "application/json"; }
  }
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Ошибка " + r.status);
  return j;
}
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 3200); }
const ext = n => (n.split(".").pop() || "").toLowerCase();
const date = t => new Date(t * 1000).toLocaleDateString("ru-RU", {day: "2-digit", month: "2-digit", year: "2-digit"});
const kb = b => b > 1048576 ? (b / 1048576).toFixed(1).replace(".", ",") + " МБ" : Math.max(1, Math.round(b / 1024)) + " КБ";
const pretty = n => n.replace(/\.[^.]+$/, "").replace(/^\d{4}-\d{2}-\d{2}_(\d{4}_)?/, "").replace(/_/g, " ");
const stamp = t => new Date(t * 1000).toLocaleString("ru-RU", {day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit"});

async function load() {
  try {
    S.data = await api("/api/list");
    if (!Object.keys(S.seen).length) {  // первое открытие: всё, что уже есть, — не «новое»
      const now = Math.floor(Date.now() / 1000);
      S.data.sections.forEach(s => S.seen[s.key] = now);
      try { localStorage.setItem("zseen", JSON.stringify(S.seen)); } catch (e) {}
    }
    render();
  }
  catch (e) { $("view").innerHTML = `<div class="err">${esc(e.message)}<br><br>Открой приложение кнопкой «Меню» в чате @zhdusha_bot.</div>`; }
}
function render() {
  $("tabs").innerHTML = TABS.map(t => `<button class="tab${t === S.tab && !$("q").value ? " on" : ""}" data-tab="${t}">${t}</button>`).join("");
  const q = $("q").value.trim().toLowerCase();
  if (q) return renderSearch(q);
  if (S.section) return renderSection(S.section);
  tg?.BackButton.hide();
  if (S.tab === "Задача") return renderTask();
  if (S.build) return renderBuild();
  if (S.rates) return renderRates();
  if (S.deal) return renderDeal();
  if (S.retro) return renderRetro();
  const secs = S.data.sections.filter(s => s.group === S.tab);
  const build = S.tab === "Прогнозы" ? `<button class="card build" data-build><b>Построить прогноз ставки</b>
    <small>полувагоны, крытые, зерновоз, фитинговые платформы · свои значения факторов · октябрь–декабрь 2026 и до 2030</small></button>
    <button class="card build" data-deal><b>Расчёт сделки: вагон в лизинг</b>
    <small>20 лет без аванса, ключевая + 3,5 п.п. · окупаемость, предельная цена, когда выходить и докупать</small></button>`
    : S.tab === "Рынок" && S.data.role === "owner" ? `<button class="card build" data-rates><b>Ставки и парк по месяцам</b>
    <small>аренда, оперирование, техрейс, рабочий парк · к прошлому месяцу и году · оповещения</small></button>
    <button class="card build" data-retro><b>Анализ ставки по месяцам</b>
    <small>2025–2026 по каждому типу: рынок рядом со ставкой, что двигало ставку, проверка прогноза на прошлом</small></button>
    <button class="card build" data-second><b>Второе мнение GPT</b>
    <small>ЖДуша на GPT проверяет наши прогнозы: с чем не согласна, что не учли, свой прогноз — PDF в чат</small></button>` : "";
  $("view").innerHTML = `<div class="grid">${build}${secs.map(card).join("")}</div>`;
}
function card(s) {
  const f = S.data.files[s.key] || [];
  const fresh = f.filter(x => x.mtime > (S.seen[s.key] || 0)).length;
  const sub = f.length ? "последний " + date(f[0].mtime) : "пока пусто";
  return `<button class="card" data-sec="${s.key}"><span class="count${fresh ? " new" : ""}">${fresh ? "+" + fresh : f.length}</span>
    <b>${esc(s.title)}</b><small>${sub}</small></button>`;
}
const HINTS = {vagon: "тип: обычный / инновационный / крытый 158 / все; возраст б/у; пессимистичный?",
  zavod: "завод или ИНН; сумма сделки, тыс. ₽", rates: "полувагоны / крытые / оба", market: "период: вчера / неделя / месяц",
  loading: "период", profile: "компания", finance: "компания, год", courts: "компания", assets: "компания",
  company: "компания, период", compare: "две компании", lease: "компания или тип вагона", prognoz: "тип вагона, год, сценарий",
  model: "пришли файл в чат или «демо»"};
function rows(list, showSec, prevSeen) {
  if (!list.length) return `<div class="empty">Здесь пока ничего нет</div>`;
  const titles = Object.fromEntries(S.data.sections.map(s => [s.key, s.title]));
  return `<div class="list">${list.map(f => `<div class="row">
    <div class="ico ${ext(f.name)}">${esc(ext(f.name).toUpperCase())}</div>
    <div class="meta"><div>${esc(pretty(f.name))}</div><small>${prevSeen !== undefined && f.mtime > prevSeen ? '<span class="tag new">новое</span> ' : ""}${f.guest ? '<span class="tag guest">гость</span> ' : ""}${stamp(f.mtime)} · ${kb(f.size)}${showSec ? " · " + esc(titles[f.sec]) : ""}</small></div>
    <button class="act" data-open="${esc(f.id)}">Открыть</button><button class="act" data-send="${esc(f.id)}">В чат</button></div>`).join("")}</div>`;
}
function renderSection(key) {
  const s = S.data.sections.find(x => x.key === key);
  const f = S.data.files[key] || [];
  const prev = S.seen[key] || 0;
  S.seen[key] = Math.floor(Date.now() / 1000);
  try { localStorage.setItem("zseen", JSON.stringify(S.seen)); } catch (e) {}
  tg?.BackButton.show();
  const cmd = ["upload", "other"].includes(key) ? "" : `<div class="ask"><input id="ask" placeholder="${esc(HINTS[key] || "уточнение (необязательно)")}">
    <button class="main-btn" data-ask="/${key}">Новый отчёт</button></div>`;
  $("view").innerHTML = `<h2><button class="back" data-back>‹</button>${esc(s.title)}</h2>${cmd}${rows(f, false, prev)}`;
}
function renderSearch(q) {
  tg?.BackButton.hide();
  const all = Object.entries(S.data.files).flatMap(([sec, l]) => l.map(f => ({...f, sec})))
    .filter(f => f.name.toLowerCase().includes(q)).sort((a, b) => b.mtime - a.mtime);
  $("view").innerHTML = `<h3>Найдено: ${all.length}</h3>${rows(all, true)}`;
}
function renderTask() {
  const direct = S.data.direct;
  $("view").innerHTML = TASKS.map((t, i) => `<div class="box"><label>${t.title} · ${t.cmd}</label><small>${t.hint}</small>
    <input id="t${i}" placeholder="${esc(t.ph)}"><button class="main-btn" data-cmd="${i}">Отправить ЖДуше</button></div>`).join("") +
    `<div class="box"><label>Своя задача</label><small>Опиши, что нужно: ЖДуша ответит в чате, а отчёт ляжет в свой раздел.
    ${direct ? "" : "Текст скопируется — вставь его в чат."}</small><textarea id="free" placeholder="например, сравни ПГК и Globaltrans по долгу за 2025"></textarea>
    <button class="main-btn" data-free>Отправить ЖДуше</button></div>
    <button class="main-btn ghost" data-upload>Загрузить файлы в «Мои загрузки»</button>
    <h3>Мои загрузки</h3>${rows(S.data.files.upload || [])}<h3>Разное</h3>${rows(S.data.files.other || [])}`;
}

// ---------- «Построить прогноз»: расчёт программой на сервере, без нейросети ----------
const F = {wagon: "inno", scenario: "base", set: {}, res: null, view: "rate", open: false};
const fmt = v => Math.round(v).toLocaleString("ru-RU");
const sgn = v => (v > 0 ? "+" : v < 0 ? "−" : "") + fmt(Math.abs(v));
async function calc(reset) {
  if (reset) F.set = {};
  try { F.res = await api("/api/forecast", {wagon: F.wagon, scenario: F.scenario, set: F.set}); }
  catch (e) { F.res = null; toast(e.message); }
  renderBuild();
}
function renderBuild() {
  tg?.BackButton.show();
  const r = F.res;
  if (!r) { $("view").innerHTML = `<div class="err">Считаю…</div>`; return calc(); }
  const d = r.defaults[r.scenario];
  const inp = (k, step) => { const [name, unit] = r.factors[k]; const v = F.set[k] ?? d[k];
    return `<div><small>${esc(name)}, ${esc(unit)}</small><input inputmode="decimal" data-f="${k}" value="${esc(String(v).replace(".", ","))}"></div>`; };
  const seg = (key, opts) => `<div class="seg">${opts.map(([v, t]) => `<button data-${key}="${v}" class="${F[key] === v ? "on" : ""}">${t}</button>`).join("")}</div>`;
  const sc = Object.keys(r.years);
  const yrs = Object.keys(r.years[sc[0]]);
  const months = ["октябрь", "ноябрь", "декабрь"];
  const q4 = `<table class="tbl"><tr><th>Сценарий</th>${months.map(m => `<th>${m.slice(0, 3)}</th>`).join("")}<th>средняя за 2026 г.*</th></tr>${sc.map(k =>
    `<tr class="${k === r.scenario ? "me" : ""}"><td>${k.replace("истичный", "ист.")}<br><small style="color:var(--hint)">${r.pace_label} ${String(r.q4[k].pace).replace(".", ",")}%/мес</small></td>${r.q4[k].months.map((m, i) =>
    `<td>${fmt(m)}<br><small style="color:var(--hint)">${sgn(r.q4[k].delta[i])}</small></td>`).join("")}<td>${fmt(r.q4[k].avg)}</td></tr>`).join("")}</table>`;
  const years = `<table class="tbl"><tr><th>Сценарий</th>${yrs.map(y => `<th>${y}</th>`).join("")}</tr>${sc.map(k =>
    `<tr class="${k === r.scenario ? "me" : ""}"><td>${k}</td>${yrs.map(y => `<td>${fmt(r.years[k][y])}</td>`).join("")}</tr>`).join("")}</table>`;
  const py = Object.keys(r.parts), keys = [...new Set(py.flatMap(y => Object.keys(r.parts[y])))];
  const parts = `<table class="tbl"><tr><th>Фактор, ₽/сут</th>${py.map(y => `<th>${y}</th>`).join("")}</tr>${keys.map(k =>
    `<tr><td>${esc(k)}</td>${py.map(y => `<td>${sgn(r.parts[y][k] || 0)}</td>`).join("")}</tr>`).join("")}
    <tr class="me"><td>Ставка на конец года (декабрь)</td>${py.map(y => `<td>${fmt(r.end[y])}</td>`).join("")}</tr></table>`;
  const price = `<table class="tbl">${Object.entries(r.price).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${Math.abs(v) < 1 ? "связи нет" : sgn(v) + " ₽"}</td></tr>`).join("")}</table>`;
  const need = F.wagon === "inno" ? `<div class="box"><label>Что нужно для 1 500 и 1 560 ₽</label><table class="tbl">
    <tr><th>Цель</th><th>Рабочий парк</th><th>в месяц за 3 мес.</th></tr>${r.need.map(n => `<tr><td>${fmt(n.target)} ₽</td>
    <td>−${String(n.pct).replace(".", ",")}% (−${String(n.k).replace(".", ",")} тыс.)</td><td>−${(n.k / 3).toFixed(1).replace(".", ",")} тыс.</td></tr>`).join("")}</table>
    <div class="note">В августе рабочий парк сократился на 6,4 тыс. вагонов за месяц.</div></div>` : "";
  const H = r.help || {};
  const hint = k => { const h = H[k]; if (!h) return "";
    return `<div class="note">${esc(h.what)}<br><b>Почему такие значения:</b> ${esc(h.why)}<br><b>Где смотреть:</b> ${esc(h.where)}; разумно ${esc(h.range)}${h.now ? `<br><b>Сейчас:</b> ${esc(h.now)}` : ""}</div>`; };
  const setup = F.open ? `<div class="box"><label>Свои допущения — сценарий «${esc(r.scenario)}»</label>
    <div class="note">Годовые — на 2027–2030 (одно число на все годы или четыре через «;»); IV кв. 2026 — % в месяц. Пустое поле — значение сценария.</div>
    ${r.fields.map(k => `<div class="fh">${inp(k)}${H[k] ? `<div class="note">${esc(H[k].what)} Разумно ${esc(H[k].range)}.${H[k].now ? ` Сейчас: ${esc(H[k].now)}.` : ""}</div>` : ""}</div>`).join("")}
    <div class="note">Почему такие значения в сценариях и где смотреть свежие цифры — вкладка «② Факторы».</div>
    <button class="main-btn" data-calc>Рассчитать</button><button class="main-btn ghost" data-reset>Вернуть значения сценария</button>
    <button class="main-btn ghost" data-open>Скрыть настройки</button></div>`
    : `<button class="main-btn ghost" data-open>Изменить допущения ▾</button><div class="note">Значения сценариев уже подобраны (пояснения — во вкладке «Факторы»). Свои — только если есть свежая цифра.</div>`;
  const head = `<h2><button class="back" data-back>‹</button>Прогноз: ${esc(r.wagon)}</h2>
    <div class="box"><label>Тип вагона</label>${seg("wagon", [["inno", "Полувагон иннов."], ["gon", "Полувагон тип."], ["kr158", "Крытый 158"], ["kr138", "Крытый 138"], ["hop_grain", "Зерновоз"], ["fit80", "Фитинг 80'"]])}${seg("scenario", [["pess", "Пессимист."], ["base", "Базовый"], ["opt", "Оптимист."]])}
    ${seg("view", [["rate", "① Ставка"], ["factors", "② Факторы"], ["value", "③ Стоимость"]])}
    <button class="main-btn ghost" data-deal data-dw="${esc(F.wagon)}">④ Сделка и выход из неё ›</button></div>`;

async function task(text) {
  try {
    const r = await api("/api/task", {text});
    if (r.ok) { toast("Задача ушла ЖДуше — ответ придёт в чат"); return setTimeout(() => tg?.close(), 1200); }
    await copy(r.fallback || text);
    tg?.showPopup ? tg.showPopup({title: "Текст скопирован", message: "Вставь его в чат с ЖДушей и отправь:\n\n" + text, buttons: [{type: "ok"}]}, () => tg.close())
      : toast("Скопировано: вставь в чат");
  } catch (e) { toast(e.message); }
}
async function second() {
  try { const r = await api("/api/second", {}); toast(r.msg || "Задача ушла ЖДуше"); setTimeout(() => tg?.close(), 1500); }
  catch (e) { toast(e.message); }
}
async function copy(t) {
  try { await navigator.clipboard.writeText(t); return; } catch (e) {}
  const a = document.createElement("textarea"); a.value = t; document.body.append(a); a.select();
  try { document.execCommand("copy"); } catch (e) {} a.remove();
}

$("q").addEventListener("input", render);
tg?.BackButton.onClick(() => { S.section = null; S.build = false; S.rates = false; S.deal = false; S.retro = false; render(); });
// Кнопки пульта в чате (zmenu.py panel) открывают приложение сразу на расчёте: ?go=build&w=…, ?go=rates, ?go=deal, ?go=sec&s=…
(() => { const q = new URLSearchParams(location.search), go = q.get("go");
  if (go === "build") { S.tab = "Прогнозы"; S.build = true; if (q.get("w")) F.wagon = q.get("w"); }
  else if (go === "deal") { S.tab = "Прогнозы"; S.deal = true; if (q.get("w")) DL.wagon = q.get("w"); }
  else if (go === "rates") { S.tab = "Рынок"; S.rates = true; }
  else if (go === "sec" && q.get("s")) S.section = q.get("s"); })();
load();
</script>
</body>
</html>

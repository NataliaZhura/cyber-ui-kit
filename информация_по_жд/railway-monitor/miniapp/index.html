<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ЖДуша</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--bg2:var(--tg-theme-secondary-bg-color,#f2f3f5);
--text:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#8a8f98);
--link:var(--tg-theme-link-color,#2481cc);--btn:var(--tg-theme-button-color,#2481cc);
--btn-text:var(--tg-theme-button-text-color,#fff);--sep:color-mix(in srgb,var(--hint) 25%,transparent)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg2);color:var(--text);font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--sep)}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:none;color:var(--hint);font:inherit;font-size:14px;font-weight:600;padding:12px 6px;
border-bottom:2px solid transparent;cursor:pointer}
.tab.on{color:var(--link);border-color:var(--link)}
.search{padding:8px 16px 10px}
.search input{width:100%;border:0;border-radius:10px;padding:9px 12px;background:var(--bg2);color:var(--text);font:inherit}
main{padding:12px 16px 40px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--bg);border-radius:14px;padding:12px;border:0;text-align:left;color:var(--text);font:inherit;cursor:pointer;min-height:76px}
.card b{display:block;font-size:15px}
.card small{color:var(--hint);display:block;margin-top:4px}
.count{float:right;background:var(--bg2);border-radius:10px;padding:0 8px;font-size:13px;color:var(--hint)}
.count.new{background:var(--btn);color:var(--btn-text)}
h2{font-size:17px;margin:4px 0 12px;display:flex;align-items:center;gap:8px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);margin:22px 4px 8px}
.back{border:0;background:none;color:var(--link);font:inherit;font-size:22px;padding:0 4px;cursor:pointer}
.list{background:var(--bg);border-radius:14px;overflow:hidden}
.row{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--sep)}
.row:last-child{border-bottom:0}
.ico{flex:0 0 36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:#8a8f98}
.ico.pdf{background:#d93025}.ico.docx{background:#2b6cd8}.ico.xlsx,.ico.xls,.ico.csv{background:#1e8e3e}.ico.png,.ico.jpg,.ico.jpeg{background:#8e44ad}
.meta{flex:1;min-width:0}
.meta div{overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
.meta small{color:var(--hint)}
.act{border:0;background:var(--bg2);color:var(--link);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px;cursor:pointer}
.main-btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;margin:0 0 12px;background:var(--btn);color:var(--btn-text);font:inherit;font-weight:600;cursor:pointer}
.ghost{background:var(--bg);color:var(--link)}
.tag{display:inline-block;border-radius:6px;padding:0 5px;font-size:11px;font-weight:600;vertical-align:1px}
.tag.new{background:var(--btn);color:var(--btn-text)}.tag.guest{background:#f2994a;color:#fff}
.ask{display:flex;gap:8px;margin:0 0 12px}.ask input{flex:1;min-width:0;border:1px solid var(--sep);border-radius:10px;
padding:9px 10px;background:var(--bg);color:var(--text);font:inherit}.ask .main-btn{width:auto;margin:0;padding:10px 14px}
.empty{color:var(--hint);text-align:center;padding:24px 12px;background:var(--bg);border-radius:14px}
.box{background:var(--bg);border-radius:14px;padding:12px;margin-bottom:10px}
.box label{display:block;font-weight:600;margin-bottom:6px}
.box small{color:var(--hint);display:block;margin-bottom:8px}
.box input,.box textarea{width:100%;border:1px solid var(--sep);border-radius:10px;padding:9px 10px;background:var(--bg2);color:var(--text);font:inherit}
.box textarea{min-height:84px;resize:vertical}
.box select{width:100%;border:1px solid var(--sep);border-radius:10px;padding:9px 10px;background:var(--bg2);color:var(--text);font:inherit}
.tbl td.b{font-weight:700}
.reader{font-size:15px;line-height:1.45}.reader p{margin:6px 0}.reader h2,.reader h3,.reader h4{margin:16px 0 6px}
.reader .li{margin:3px 0 3px 4px}.reader .tbl{font-size:12.5px}.reader .tbl td,.reader .tbl th{white-space:normal;text-align:left;vertical-align:top;min-width:70px}.reader small{color:var(--hint)}
.box .main-btn{margin:8px 0 0}
#toast{position:fixed;left:16px;right:16px;bottom:16px;background:#222;color:#fff;border-radius:12px;padding:12px 14px;
opacity:0;transform:translateY(20px);transition:.2s;pointer-events:none;z-index:5}
#toast.on{opacity:1;transform:none}
.err{padding:40px 20px;text-align:center;color:var(--hint)}
.card.build{grid-column:1/-1;background:var(--btn);color:var(--btn-text)}.card.build small{color:var(--btn-text);opacity:.85}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.seg button{flex:1 1 30%;border:1px solid var(--sep);background:var(--bg2);color:var(--text);
border-radius:10px;padding:8px 4px;font:inherit;font-size:13px;cursor:pointer}.seg button.on{background:var(--btn);color:var(--btn-text);border-color:var(--btn)}
.why{margin:6px 0 0;padding-left:18px}.why li{margin:3px 0;font-size:13px}
.fh{margin:10px 0;padding-bottom:8px;border-bottom:1px solid var(--sep)}.fh:last-of-type{border-bottom:0}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f2 div small{margin:0 0 3px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0}.tbl th,.tbl td{padding:5px 4px;border-bottom:1px solid var(--sep);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal}.tbl th{color:var(--hint);font-weight:600}
.tbl tr.me td{font-weight:700}.wrap{overflow-x:auto}.note{color:var(--hint);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header>
  <nav class="tabs" id="tabs"></nav>
  <div class="search"><input id="q" type="search" placeholder="Поиск по всем отчётам" autocomplete="off"></div>
</header>
<main id="view"><div class="err">Загружаю…</div></main>
<div id="toast"></div>
<input id="file" type="file" multiple hidden accept=".pdf,.docx,.xlsx,.xls,.pptx,.csv,.png,.jpg,.jpeg,.md,.html,.htm">
<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const TABS = ["Рынок", "Прогнозы", "Компании", "Задача"];
const TASKS = [
  {cmd: "/find", title: "Найти ИНН и ОГРН", hint: "Название компании", ph: "например, Первая грузовая компания"},
  {cmd: "/remember", title: "Запомнить", hint: "Компания, правило или факт", ph: "например, ПГК — в приоритете"},
  {cmd: "/save", title: "Сохранить в PDF и Word", hint: "Что сохранить", ph: "например, последнюю справку по ПГК"},
];
const S = {data: null, tab: "Рынок", section: null, seen: {}};
const SV = {wagon: "", contract: "spot", age: "5-15", repair: "owner", outlook: "flat", done: ""};  // анкета ставок
try { S.seen = JSON.parse(localStorage.getItem("zseen") || "{}"); } catch (e) {}
try { const t = localStorage.getItem("ztab"); if (TABS.includes(t)) S.tab = t; } catch (e) {}
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

async function api(path, body, raw) {
  const opt = {headers: {"X-Init-Data": tg?.initData || ""}};
  if (body !== undefined) {
    opt.method = "POST";
    if (raw) { opt.body = body; opt.headers["X-File-Name"] = encodeURIComponent(raw); }
    else { opt.body = JSON.stringify(body); opt.headers["Content-Type"] = "application/json"; }
  }
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Ошибка " + r.status);
  return j;
}
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 3200); }
const ext = n => (n.split(".").pop() || "").toLowerCase();
const date = t => new Date(t * 1000).toLocaleDateString("ru-RU", {day: "2-digit", month: "2-digit", year: "2-digit"});
const kb = b => b > 1048576 ? (b / 1048576).toFixed(1).replace(".", ",") + " МБ" : Math.max(1, Math.round(b / 1024)) + " КБ";
const pretty = n => n.replace(/\.[^.]+$/, "").replace(/^\d{4}-\d{2}-\d{2}_(\d{4}_)?/, "").replace(/_/g, " ");
const stamp = t => new Date(t * 1000).toLocaleString("ru-RU", {day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit"});

async function load() {
  try {
    S.data = await api("/api/list");
    if (!Object.keys(S.seen).length) {  // первое открытие: всё, что уже есть, — не «новое»
      const now = Math.floor(Date.now() / 1000);
      S.data.sections.forEach(s => S.seen[s.key] = now);
      try { localStorage.setItem("zseen", JSON.stringify(S.seen)); } catch (e) {}
    }
    render();
    if (S.pendingRead) { const f = S.pendingRead; S.pendingRead = null; openRead(f); }
  }
  catch (e) { $("view").innerHTML = `<div class="err">${esc(e.message)}<br><br>Открой приложение кнопкой «Меню» в чате @zhdusha_bot.</div>`; }
}
function render() {
  if (S.data.role === "respondent") { document.querySelector("header").style.display = "none"; return renderSurvey(); }
  $("tabs").innerHTML = TABS.map(t => `<button class="tab${t === S.tab && !$("q").value ? " on" : ""}" data-tab="${t}">${t}</button>`).join("");
  const q = $("q").value.trim().toLowerCase();
  if (q) return renderSearch(q);
  if (S.section) return renderSection(S.section);
  tg?.BackButton.hide();
  if (S.tab === "Задача") return renderTask();
  if (S.build) return renderBuild();
  if (S.rates) return renderRates();
  if (S.deal) return renderDeal();
  if (S.retro) return renderRetro();
  if (S.survey) return renderSurvey();
  if (S.read) return renderRead();
  const secs = S.data.sections.filter(s => s.group === S.tab);
  const build = S.tab === "Прогнозы" ? `<button class="card build" data-build><b>Построить прогноз ставки</b>
    <small>полувагоны, крытые, зерновоз, фитинговые платформы · свои значения факторов · октябрь–декабрь 2026 и до 2030</small></button>
    <button class="card build" data-deal><b>Расчёт сделки: вагон в лизинг</b>
    <small>20 лет без аванса, ключевая + 3,5 п.п. · окупаемость, предельная цена, когда выходить и докупать</small></button>`
    : S.tab === "Рынок" && S.data.role === "owner" ? `<button class="card build" data-rates><b>Ставки и парк по месяцам</b>
    <small>аренда, оперирование, техрейс, рабочий парк · к прошлому месяцу и году · оповещения</small></button>
    <button class="card build" data-retro><b>Анализ ставки по месяцам</b>
    <small>2025–2026 по каждому типу: рынок рядом со ставкой, что двигало ставку, проверка прогноза на прошлом</small></button>
    <button class="card build" data-second><b>Второе мнение GPT</b>
    <small>ЖДуша на GPT проверяет наши прогнозы: с чем не согласна, что не учли, свой прогноз — PDF в чат</small></button>` : "";
  const co = S.tab === "Компании" && (S.data.companies || []).length ? `<div class="box"><label>Справка по компании</label>
    <div class="note">Нажмите компанию — ЖДуша подготовит справку (финансы, суды, имущество, новости) и пришлёт PDF в чат; отчёт ляжет в раздел «Справка по компании».</div>
    <div class="seg">${S.data.companies.map(c => `<button data-task="/profile ${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div class="ask"><input id="ask" placeholder="другая компания: название или ИНН"><button class="main-btn" data-ask="/profile">Справка</button></div></div>` : "";
  const sv = S.tab === "Рынок" ? `<button class="card build" data-survey><b>Анкета ставок рынка</b>
    <small>5 минут раз в месяц: ставка по вашему типу вагона, договор, ожидания. Свой ряд ставок — от ответов участников рынка</small></button>` : "";
  $("view").innerHTML = `${co}<div class="grid">${build}${sv}${secs.map(card).join("")}</div>`;
}
function card(s) {
  const f = S.data.files[s.key] || [];
  const fresh = f.filter(x => x.mtime > (S.seen[s.key] || 0)).length;
  const sub = f.length ? "последний " + date(f[0].mtime) : "пока пусто";
  return `<button class="card" data-sec="${s.key}"><span class="count${fresh ? " new" : ""}">${fresh ? "+" + fresh : f.length}</span>
    <b>${esc(s.title)}</b><small>${sub}</small></button>`;
}
const HINTS = {vagon: "тип: обычный / инновационный / крытый 158 / все; возраст б/у; пессимистичный?",
  zavod: "завод или ИНН; сумма сделки, тыс. ₽", rates: "полувагоны / крытые / оба", market: "период: вчера / неделя / месяц",
  loading: "период", profile: "компания", finance: "компания, год", courts: "компания", assets: "компания",
  company: "компания, период", compare: "две компании", lease: "компания или тип вагона", prognoz: "тип вагона, год, сценарий",
  model: "пришли файл в чат или «демо»"};
// Формы «Новый отчёт» по разделам: компания, период и другие параметры → задача ЖДуше с точным названием отчёта и файла.
// Пустое поле — значение по умолчанию (написано в подсказке). Отчёт называется «Раздел: Компания — период».
const WAG = ["все типы", "полувагоны", "крытые", "зерновозы", "фитинговые платформы"];
const FORMS = {
  poluvagony: {file: "полувагоны", f: [["period"], ["focus", "select", "Что смотреть", ["всё", "ставки", "парк и баланс", "погрузка", "операторы"]]]},
  krytye: {file: "крытые", f: [["period"], ["focus", "select", "Что смотреть", ["всё", "ставки", "парк и баланс", "погрузка", "операторы"]]]},
  zerno: {file: "зерновозы", f: [["period"], ["focus", "select", "Что смотреть", ["всё", "ставки", "парк и баланс", "погрузка зерна", "экспорт и порты"]]]},
  fiting: {file: "фитинги", f: [["period"], ["focus", "select", "Что смотреть", ["всё", "ставки", "парк и баланс", "контейнеры", "операторы"]]]},
  market: {file: "новости_рынка", f: [["period", 7], ["topic", "select", "Тема", ["все", "полувагоны", "крытые", "зерновозы", "фитинги", "порты и море", "тарифы РЖД"]]]},
  rates: {file: "ставки_аренды", f: [["period"], ["wagon", "select", "Тип вагона", WAG]]},
  loading: {file: "погрузка", f: [["period"], ["cargo", "select", "Груз", ["все", "уголь", "зерно", "стройгрузы", "металлы", "удобрения", "контейнеры"]]]},
  balance: {file: "баланс_парка", f: [["period"], ["wagon", "select", "Тип вагона", WAG]]},
  forecast: {file: "прогноз_на_неделю", f: [["week", "date", "Неделя с"], ["wagon", "select", "Тип вагона", WAG]]},
  prognoz: {file: "прогноз_ставок", f: [["wagon", "select", "Тип вагона", ["инновационный полувагон", "типовой полувагон", "крытый 158", "крытый 138", "зерновоз", "фитинг 80'"]],
    ["scenario", "select", "Сценарий", ["все три", "базовый", "оптимистичный", "пессимистичный"]], ["to", "select", "Горизонт", ["2026", "2027", "2028", "2030"]]]},
  vagon: {file: "стоимость_вагона", f: [["wagon", "select", "Тип вагона", ["инновационный полувагон", "типовой полувагон", "крытый 158", "зерновоз", "фитинг 80'"]],
    ["age", "number", "Возраст б/у, лет", "пусто — новый"], ["scenario", "select", "Сценарий", ["базовый", "оптимистичный", "пессимистичный"]], ["year", "select", "На год", ["2026", "2027", "2028", "2029", "2030"]]]},
  lease: {file: "оперировать_или_сдавать", f: [["company", "company", "Компания (необязательно)"], ["wagon", "select", "Тип вагона", WAG.slice(1)],
    ["term", "number", "Срок, лет", "пусто — 5"], ["rate", "number", "Своя ставка аренды, ₽/сут", "пусто — рыночная"]]},
  model: {file: "финмодель", f: [["company", "company", "Компания"], ["xlsx", "file", "Файл модели (Excel)"],
    ["horizon", "number", "Горизонт дисконтирования, лет", "пусто — 20 лет"], ["disc", "text", "Ставка дисконтирования", "пусто — ключевая + 3,5 п.п."],
    ["util", "number", "Загрузка вагонов, %", "пусто — 95"], ["opex", "number", "Расходы, % выручки", "пусто — 12"],
    ["resid", "number", "Остаточная стоимость в конце, % цены", "пусто — по модели цены б/у"],
    ["scen", "select", "Сценарии", ["все: база, снижение, рост, стресс", "только база и стресс"]],
    ["check", "select", "Что проверить", ["всё: покрытие долга, точка пробоя, выход", "покрытие платежей по годам", "когда выходить из сделки"]]]},
  zavod: {file: "завод", f: [["company", "company", "Завод (название или ИНН)"], ["sum", "number", "Сумма аванса, млн ₽", ""], ["delivery", "date", "Срок поставки"]]},
  company: {file: "новости_оператора", title: "Анализ и новости", f: [["company", "company", "Компания"], ["period", 30]]},
  profile: {file: "справка", f: [["company", "company", "Компания"], ["years", "years", "Отчётность за годы"]]},
  finance: {file: "финансы", f: [["company", "company", "Компания"], ["years", "years", "Годы"], ["std", "select", "Отчётность", ["РСБУ", "МСФО", "обе"]]]},
  courts: {file: "суды", f: [["company", "company", "Компания"], ["period", 365]]},
  assets: {file: "имущество_лизинг", f: [["company", "company", "Компания"], ["what", "select", "Что смотреть", ["всё", "вагоны и лизинг", "недвижимость", "залоги"]]]},
  compare: {file: "сравнение", f: [["company", "company", "Компания 1"], ["company2", "company", "Компания 2"], ["years", "years", "Годы"],
    ["what", "select", "Сравнить", ["всё", "финансы", "парк", "долг", "ставки и клиенты"]]]},
};
const FV = {};  // значения форм: FV[раздел][поле]
const ymd = d => d.toISOString().slice(0, 10), rus = v => v ? v.split("-").reverse().join(".") : "";
function perDays(n) { const t = new Date(), f = new Date(); f.setDate(t.getDate() - n); return [ymd(f), ymd(t)]; }
function formHtml(key) {
  const F_ = FORMS[key], v = FV[key] = FV[key] || {};
  const co = (k, label) => { const L = S.data.companies || [], cur = v[k] || "";
    return `<div class="fh"><small>${label}</small><select data-fv="${key}" data-fk="${k}"><option value="">— выберите —</option>${L.map(c =>
      `<option${c === cur ? " selected" : ""}>${esc(c)}</option>`).join("")}<option value="__own"${cur && !L.includes(cur) ? " selected" : ""}>другая (название или ИНН)…</option></select>
      ${cur === "__own" || (cur && !L.includes(cur)) ? `<input data-fv="${key}" data-fk="${k}" placeholder="название или ИНН" value="${esc(cur === "__own" ? "" : cur)}">` : ""}</div>`; };
  const body = F_.f.map(([k, t, label, opt]) => {
    if (k === "period") { const def = t || 30; if (!v.from) { [v.from, v.to] = perDays(def); v.pk = "n" + def; }
      return `<div class="fh"><small>Период</small><div class="seg">${[["7 дней", 7], ["30 дней", 30], ["3 мес.", 91], ["год", 365]].map(([tt, n]) =>

// Чтение отчёта прямо в приложении: Telegram на компьютере не показывает PDF внутри чата
function mdHtml(md) {
  const inl = t => esc(t).replace(/&lt;(\/?)small&gt;/g, "<$1small>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  const L = md.split("\n"), out = [];
  for (let i = 0; i < L.length; i++) {
    const x = L[i];
    if (/^\|/.test(x)) {
      const t = [];
      while (i < L.length && /^\|/.test(L[i])) { if (!/^\|[\s|:-]+\|?\s*$/.test(L[i])) t.push(L[i]); i++; }
      i--;
      out.push(`<div class="wrap"><table class="tbl">${t.map((r, k) => "<tr>" + r.replace(/^\||\|\s*$/g, "").split("|")
        .map(c => k ? `<td>${inl(c.trim())}</td>` : `<th>${inl(c.trim())}</th>`).join("") + "</tr>").join("")}</table></div>`);
    } else if (/^#{1,4} /.test(x)) { const n = x.match(/^#+/)[0].length; out.push(`<h${Math.min(n + 1, 4)}>${inl(x.replace(/^#+ /, ""))}</h${Math.min(n + 1, 4)}>`); }
    else if (/^\s*[-*•] /.test(x)) out.push(`<div class="li">• ${inl(x.replace(/^\s*[-*•] /, ""))}</div>`);
    else if (/^> /.test(x)) out.push(`<div class="note">${inl(x.slice(2))}</div>`);
    else if (x.trim()) out.push(`<p>${inl(x)}</p>`);
  }
  return out.join("");
}

async function copy(t) {
  try { await navigator.clipboard.writeText(t); return; } catch (e) {}
  const a = document.createElement("textarea"); a.value = t; document.body.append(a); a.select();
  try { document.execCommand("copy"); } catch (e) {} a.remove();
}

document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.build !== undefined) { S.build = true; F.res = null; render(); window.scrollTo(0, 0); }
  else if (d.second !== undefined) second();
  else if (d.read) openRead(d.read);
  else if (d.fsend) formSend(d.fsend);
  else if (d.fp) { const v = FV[d.fp] = FV[d.fp] || {}; if (d.fy) { v.from = d.fy + "-01-01"; v.to = d.fy + "-12-31"; v.pk = "y" + d.fy; } else { [v.from, v.to] = perDays(+d.fn); v.pk = "n" + d.fn; }
    renderSection(d.fp); toast(`Период: ${rus(v.from)} — ${rus(v.to)}`); }
  else if (d.per) { const st = {F, RT, RO}[d.per]; st.from = d.pa; st.to = d.pb; st.touched = true; ({F: renderBuild, RT: renderRates, RO: renderRetro})[d.per](); }
  else if (d.pdf) pdfSend(d.pdf === "forecast" ? {kind: "forecast", wagon: F.wagon, scenario: F.scenario, set: F.set, from: F.from, to: F.to}
    : d.pdf === "deal" ? {kind: "deal", wagon: DL.wagon, scenario: DL.scenario, ...DL.set}
    : d.pdf === "rates" ? {kind: "rates", from: RT.from, to: RT.to} : {kind: "retro", wagon: RO.wagon, from: RO.from, to: RO.to});
  else if (d.dterm) { DL.set.term = d.dterm; DL.res = null; renderDeal(); }
  else if (d.survey !== undefined) { S.survey = true; render(); window.scrollTo(0, 0); }
  else if (d.svk) { svKeep(); SV[d.svk] = d.svv; renderSurvey(); }
  else if (d.svsend !== undefined) svSend();
  else if (d.retro !== undefined) { S.retro = true; RO.res = null; render(); window.scrollTo(0, 0); }
  else if (d.rw) { RO.wagon = d.rw; RO.res = null; renderRetro(); }
  else if (d.rates !== undefined) { S.rates = true; RT.res = null; render(); window.scrollTo(0, 0); }
  else if (d.deal !== undefined) { S.deal = true; S.build = false; if (d.dw) { DL.wagon = d.dw; DL.set = {}; } DL.res = null; render(); window.scrollTo(0, 0); }
  else if (d.dwagon || d.dscenario) { if (d.dwagon) { DL.wagon = d.dwagon; DL.set = {}; } if (d.dscenario) DL.scenario = d.dscenario; DL.res = null; renderDeal(); }
  else if (d.dexit) { DL.exitY = d.dexit; renderDeal(); }
  else if (d.dcalc !== undefined) { document.querySelectorAll("[data-dv]").forEach(i => { if (i.value.trim()) DL.set[i.dataset.dv] = i.value.trim(); else delete DL.set[i.dataset.dv]; }); DL.res = null; renderDeal();
    pdfSend({kind: "deal", wagon: DL.wagon, scenario: DL.scenario, ...DL.set}); }
  else if (d.dreset !== undefined) { DL.set = {}; DL.res = null; renderDeal(); }
  else if (d.view) { F.view = d.view; renderBuild(); }
  else if (d.open !== undefined) { F.open = !F.open; renderBuild(); }
  else if (d.wagon || d.scenario) { if (d.wagon) F.wagon = d.wagon; if (d.scenario) F.scenario = d.scenario; calc(true); }
  else if (d.calc !== undefined) { document.querySelectorAll("[data-f]").forEach(i => F.set[i.dataset.f] = i.value.trim()); calc();
    pdfSend({kind: "forecast", wagon: F.wagon, scenario: F.scenario, set: F.set, from: F.from, to: F.to}); }
  else if (d.reset !== undefined) calc(true);
  else if (d.tab) { S.tab = d.tab; S.section = null; S.build = false; S.rates = false; S.deal = false; S.retro = false; S.survey = false; S.read = null; $("q").value = ""; try { localStorage.setItem("ztab", d.tab); } catch (e) {} render(); }
  else if (d.sec) { S.section = d.sec; render(); window.scrollTo(0, 0); }
  else if (d.back !== undefined) { S.section = null; S.build = false; S.rates = false; S.deal = false; S.retro = false; S.survey = false; S.read = null; render(); }
  else if (d.send) { try { await api("/api/send", {id: d.send}); toast("Файл отправлен в чат"); } catch (er) { toast(er.message); } }
  else if (d.open) {
    try { const r = await api("/api/link", {id: d.open}); const url = location.origin + r.url; tg?.openLink ? tg.openLink(url) : window.open(url); }
    catch (er) { toast(er.message); }
  }
  else if (d.task) task(d.task);
  else if (d.ask) { const v = $("ask").value.trim(); task(v ? d.ask + " " + v : d.ask); }
  else if (d.cmd !== undefined) { const t = TASKS[d.cmd], v = $("t" + d.cmd).value.trim(); task(v ? t.cmd + " " + v : t.cmd); }
  else if (d.free !== undefined) { const v = $("free").value.trim(); v ? task(v) : toast("Напиши задачу"); }
  else if (d.upload !== undefined) $("file").click();
});
$("file").addEventListener("change", async e => {
  const fs = [...e.target.files]; e.target.value = ""; let ok = 0;
  for (const [i, f] of fs.entries()) {
    if (f.size > 20 * 1048576) { toast(f.name + ": больше 20 МБ — пропущен"); continue; }
    toast(`Загружаю ${i + 1} из ${fs.length}: ${f.name}…`);
    try { await api("/api/upload", f, f.name); ok++; } catch (er) { toast(f.name + ": " + er.message); }
  }
  if (fs.length) { toast(`Загружено ${ok} из ${fs.length}. Выпуски Argus разложатся сами через минуту`); await load(); }
});
$("q").addEventListener("input", render);
document.addEventListener("change", e => { const t = e.target;
  if (t.dataset && t.dataset.fv) { const v = FV[t.dataset.fv] = FV[t.dataset.fv] || {}; v[t.dataset.fk] = t.value;
    if (t.dataset.fk === "from" || t.dataset.fk === "to") { v.pk = ""; renderSection(t.dataset.fv); return; }  // свои даты — кнопки не подсвечены
    if (t.tagName === "SELECT" && (t.value === "__own" || t.dataset.fk === "company" || t.dataset.fk === "company2")) renderSection(t.dataset.fv); return; }
  if (!t.dataset || !t.dataset.pf) return;
  const st = {F, RT, RO}[t.dataset.pf]; st[t.dataset.pk] = t.value; st.touched = true; ({F: renderBuild, RT: renderRates, RO: renderRetro})[t.dataset.pf](); });
tg?.BackButton.onClick(() => { S.section = null; S.build = false; S.rates = false; S.deal = false; S.retro = false; S.survey = false; S.read = null; render(); });
// Кнопки пульта в чате (zmenu.py panel) открывают приложение сразу на расчёте: ?go=build&w=…, ?go=rates, ?go=deal, ?go=sec&s=…
(() => { const q = new URLSearchParams(location.search), go = q.get("go");
  if (go === "build") { S.tab = "Прогнозы"; S.build = true; if (q.get("w")) F.wagon = q.get("w"); }
  else if (go === "deal") { S.tab = "Прогнозы"; S.deal = true; if (q.get("w")) DL.wagon = q.get("w"); }
  else if (go === "rates") { S.tab = "Рынок"; S.rates = true; }
  else if (go === "survey") { S.tab = "Рынок"; S.survey = true; }
  else if (go === "read" && q.get("f")) S.pendingRead = q.get("f");
  else if (go === "sec" && q.get("s")) S.section = q.get("s"); })();
load();
</script>
</body>
</html>
